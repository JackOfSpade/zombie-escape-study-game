<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Study terminal · ChatGPT UI</title>
    <style>
      :root {
        color-scheme: dark;
        font: 15px/1.6 system-ui;
        background: #101d21;
        color: #e1eee6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px;
        max-width: 920px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      small,
      .muted {
        color: #a1b8b6;
      }
      h1 {
        font-size: 21px;
        margin: 0;
      }
      article {
        background: #192a2e;
        border: 1px solid #385052;
        border-radius: 12px;
        padding: 18px;
        margin: 18px 0;
      }
      #messages {
        min-height: 100px;
        max-height: 360px;
        overflow: auto;
      }
      .message {
        padding: 12px 16px;
        background: #192a2e;
        margin: 12px 0;
        border-radius: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user {
        margin-left: 24px;
        background: #233e3b;
      }
      .role {
        font-size: 12px;
        color: #6ce7bd;
        display: block;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 90px;
        padding: 12px;
        border: 1px solid #52716e;
        border-radius: 10px;
        font: inherit;
        background: #14262a;
        color: inherit;
      }
      button {
        padding: 11px 18px;
        border: 0;
        border-radius: 8px;
        background: #8debbd;
        color: #0a2823;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }
      #status {
        font-size: 13px;
        white-space: pre-wrap;
      }
      #keys {
        color: #8debbd;
        font-weight: 700;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <small id="kicker">ZOMBIE STUDY / REGULAR CHAT PROOF</small>
        <h1 id="title">Connecting to ChatGPT…</h1>
      </div>
      <span id="keys">0 demo keys</span>
    </header>
    <p class="muted" id="intro">
      Synthetic puzzle only. No real game save, curriculum progress, API key or
      polling worker.
    </p>
    <article id="question">Waiting for the host’s tool result.</article>
    <div id="messages" aria-live="polite"></div>
    <form id="form">
      <label for="answer">Answer or ask Terminal AI</label
      ><textarea
        id="answer"
        placeholder="Work through the question here… Shift+Enter adds a line"
        disabled
      ></textarea>
      <footer>
        <span id="status" role="status">Checking the ChatGPT host bridge…</span
        ><button id="send" disabled>Send ↑</button>
      </footer>
    </form>
    <p id="live-status" role="status" hidden></p>
    <button id="retry" type="button" hidden>
      Retry the saved ChatGPT turn
    </button>
    <button id="resume" type="button" hidden>Resume waiting for turns</button>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let state = null,
          mode = null,
          ready = false,
          busy = false,
          rpcId = 0,
          hostOrigin = null,
          poll = null,
          polls = 0,
          waits = 0;
        const pending = new Map();
        const posted = new Set();
        const notify = (method, params) =>
          parent.postMessage(
            { jsonrpc: "2.0", method, params },
            hostOrigin || "*",
          );
        function rpc(method, params) {
          return new Promise((resolve, reject) => {
            const id = ++rpcId;
            const timer = setTimeout(() => {
              pending.delete(id);
              reject(Error("The ChatGPT host did not acknowledge " + method));
            }, 10000);
            pending.set(id, { resolve, reject, timer });
            parent.postMessage(
              { jsonrpc: "2.0", id, method, params },
              hostOrigin || "*",
            );
          });
        }
        function show(text) {
          (mode === "live" ? $("live-status") : $("status")).textContent = text;
        }
        // ChatGPT holds a connector tool call behind an "Allow ChatGPT to use
        // zombie-escape-study-game?" card in the chat column until the player
        // answers it, and this app can cover that card in full view.
        const APPROVAL_HINT =
          "Message accepted by the host; still waiting for ChatGPT to call the reply tool. If the chat shows an “Allow ChatGPT to use zombie-escape-study-game?” card, choose Always allow there. The card sits in the chat column, so leave full view if this app covers it.";
        const APPROVAL_HINT_AFTER_POLLS = 12;
        function rows(messages, label) {
          return messages.map((m) => {
            const row = document.createElement("div");
            const user = m.role === "user" || m.role === "learner";
            row.className = "message " + (user ? "user" : "assistant");
            const role = document.createElement("strong");
            role.className = "role";
            role.textContent = user ? label : "Terminal AI";
            const content = document.createElement("div");
            content.textContent = m.text;
            row.append(role, content);
            return row;
          });
        }
        function setMode(next) {
          if (mode === next) return;
          mode = next;
          const live = next === "live";
          $("form").hidden = live;
          $("live-status").hidden = !live;
          $("kicker").textContent = live
            ? "ZOMBIE STUDY / LIVE TERMINAL RELAY"
            : "ZOMBIE STUDY / REGULAR CHAT PROOF";
          $("intro").textContent = live
            ? "Live relay. Type in the game's terminal; each message you send there starts a turn in this conversation. Replies return to the game, which applies its own once-only reward. Nothing is sent until live study requests are released in the game's Settings."
            : "Synthetic puzzle only. No real game save, curriculum progress, API key or polling worker.";
        }
        function render(snapshot) {
          if (!snapshot) return;
          if (snapshot.synthetic && snapshot.demoId)
            return renderDemo(snapshot);
          if (snapshot.live && snapshot.relayId) return renderLive(snapshot);
        }
        function renderDemo(snapshot) {
          if (mode === "live") return;
          setMode("demo");
          if (
            state &&
            snapshot.demoId === state.demoId &&
            snapshot.revision < state.revision
          )
            return;
          state = snapshot;
          $("title").textContent = snapshot.question.title;
          $("question").textContent = snapshot.question.prompt;
          $("keys").textContent =
            snapshot.keys +
            " demo key" +
            (snapshot.keys === 1 ? " · solved" : "s");
          $("messages").replaceChildren(...rows(snapshot.messages, "You"));
          $("messages").scrollTop = $("messages").scrollHeight;
          $("answer").disabled = !ready;
          $("send").disabled = !ready || busy || !!snapshot.pending;
          $("retry").hidden = !snapshot.pending || busy;
          if (!snapshot.pending) {
            clearTimeout(poll);
            show(
              snapshot.solved
                ? snapshot.outcome === "gap"
                  ? "Key conceded on a declared gap · one synthetic demo key. Recorded gaps: " +
                    (snapshot.gaps || []).join(", ") +
                    ". This does not affect your real game."
                  : "Solved · one synthetic demo key. This does not affect your real game."
                : "Connected to regular ChatGPT. Terminal AI assumes you know this; say so if you do not. Send starts a host conversation turn.",
            );
          }
        }
        function renderLive(snapshot) {
          if (mode === "demo") return;
          setMode("live");
          if (
            state &&
            snapshot.relayId === state.relayId &&
            snapshot.revision < state.revision
          )
            return;
          state = snapshot;
          const turn = snapshot.turn;
          $("keys").textContent =
            snapshot.answered +
            (snapshot.answered === 1 ? " turn answered" : " turns answered");
          $("title").textContent = turn
            ? turn.question.title || "Game terminal turn"
            : "Waiting for your game terminal";
          $("question").textContent = turn
            ? turn.question.prompt
            : snapshot.released
              ? "No pending terminal turn. Send a message from the game's terminal."
              : "Live study requests are not released. Enable them in the game's Settings → ChatGPT handoff, then send a message from the game's terminal.";
          const messages = turn ? [...turn.messages] : [];
          if (turn?.reply)
            messages.push({ role: "tutor", text: turn.reply.text });
          $("messages").replaceChildren(...rows(messages, "You (in the game)"));
          $("messages").scrollTop = $("messages").scrollHeight;
          if (turn?.status !== "claimed") $("retry").hidden = true;
          if (turn?.status === "answered")
            show(
              turn.reply.complete
                ? turn.reply.outcome === "gap"
                  ? "Terminal AI conceded the key on a declared knowledge gap. The game records the gap and applies its once-only reward separately."
                  : "Terminal AI marked this conversation complete. The game applies its once-only reward separately."
                : "Reply delivered to the game. Waiting for your next terminal message.",
            );
        }
        async function tool(name, args) {
          const result = await rpc("tools/call", { name, arguments: args });
          if (result?.isError)
            throw Error(
              result.content?.find((c) => c.type === "text")?.text ||
                "Terminal tool rejected",
            );
          if (result?.structuredContent) render(result.structuredContent);
          return result;
        }
        async function sendPrompt(prompt) {
          show("Sending this turn to the regular ChatGPT conversation…");
          const result = await rpc("ui/message", {
            role: "user",
            content: [{ type: "text", text: prompt }],
          });
          if (result?.isError)
            throw Error("ChatGPT declined the conversation message");
          show(
            "Message accepted by the host. Waiting for ChatGPT to call the reply tool…",
          );
        }
        // Synthetic demo: Send stages a turn, then posts it as a host message.
        async function refreshDemo() {
          if (!state?.pending) return;
          try {
            await tool("read_study_terminal_demo", { demoId: state.demoId });
          } catch (error) {
            show(error.message);
            $("retry").hidden = false;
            return;
          }
          if (state.pending && ++polls < 180) {
            if (polls === APPROVAL_HINT_AFTER_POLLS) show(APPROVAL_HINT);
            poll = setTimeout(refreshDemo, 1000);
          } else if (state.pending) {
            show(
              "Still waiting for ChatGPT. The answer is retained; retry its saved turn if needed.",
            );
            $("retry").hidden = false;
          }
        }
        async function sendDemoPrompt() {
          if (!state?.pending) return;
          await sendPrompt(state.pending.prompt);
          polls = 0;
          clearTimeout(poll);
          poll = setTimeout(refreshDemo, 500);
        }
        // Live relay: claim each released game turn, post it once, wait for the reply.
        function schedule(fn, ms) {
          clearTimeout(poll);
          poll = setTimeout(fn, ms);
        }
        async function liveLoop() {
          if (mode !== "live" || !state || busy) return;
          const turn = state.turn;
          try {
            if (turn?.status === "claimed") {
              if (!posted.has(turn.turnId)) {
                posted.add(turn.turnId);
                polls = 0;
                await sendPrompt(turn.prompt);
              } else {
                await tool("read_study_terminal", { relayId: state.relayId });
              }
              if (state.turn?.status === "claimed") {
                if (++polls < 240) {
                  if (polls === APPROVAL_HINT_AFTER_POLLS) show(APPROVAL_HINT);
                  return schedule(liveLoop, 1000);
                }
                show(
                  "Still waiting for ChatGPT's reply. Retry the saved turn if the conversation did not respond.",
                );
                $("retry").hidden = false;
                return;
              }
              return schedule(liveLoop, 1500);
            }
            await tool("claim_study_terminal_turn", {
              relayId: state.relayId,
              revision: state.revision,
            });
            if (state.turn?.status === "claimed") return schedule(liveLoop, 0);
            if (!state.turn)
              show(
                state.released
                  ? "Connected. Waiting for a terminal message from your game…"
                  : "Waiting. Release live study requests in the game's Settings to start.",
              );
            // Keep listening while the panel is open: quick polls for the first
            // ten minutes, then one every ten seconds. A game message, focus or
            // the Resume button brings the quick cadence back.
            const idle = ++waits >= 240;
            if (idle) {
              show(
                "Still connected after ten minutes without a game terminal message; checking every ten seconds. Resume to check quickly again.",
              );
              $("resume").hidden = false;
            }
            return schedule(liveLoop, idle ? 10000 : 2500);
          } catch (error) {
            show(
              /relay unavailable|reopen the study terminal/i.test(error.message)
                ? "The game relay restarted, so this terminal is no longer registered. Ask ChatGPT to open your study terminal again."
                : error.message,
            );
            if (state?.turn?.status === "claimed") $("retry").hidden = false;
            else schedule(liveLoop, 5000);
          }
        }
        window.addEventListener("message", (event) => {
          if (event.source !== parent || parent === window) return;
          const m = event.data;
          if (!m || m.jsonrpc !== "2.0") return;
          if (hostOrigin && event.origin !== hostOrigin) return;
          if (event.origin !== "null") hostOrigin = event.origin;
          if (typeof m.id === "number" && pending.has(m.id)) {
            const p = pending.get(m.id);
            pending.delete(m.id);
            clearTimeout(p.timer);
            if (m.error)
              p.reject(
                Error(m.error.message || "ChatGPT host rejected the request"),
              );
            else p.resolve(m.result);
            return;
          }
          if (m.method === "ui/notifications/tool-result") {
            render(m.params?.structuredContent);
            if (mode === "live" && ready) {
              waits = 0;
              schedule(liveLoop, 0);
            }
          }
        });
        $("form").onsubmit = async (event) => {
          event.preventDefault();
          const answer = $("answer").value;
          if (!state || busy || state.pending || !answer.trim()) return;
          busy = true;
          $("send").disabled = true;
          try {
            await tool("stage_study_terminal_turn", {
              demoId: state.demoId,
              revision: state.revision,
              answer,
            });
            $("answer").value = "";
            await sendDemoPrompt();
          } catch (error) {
            show(error.message);
            $("retry").hidden = !state?.pending;
          } finally {
            busy = false;
            if (state) {
              $("send").disabled = !ready || !!state.pending;
              $("retry").hidden = !state.pending;
            }
          }
        };
        $("retry").onclick = async () => {
          if (busy) return;
          busy = true;
          $("retry").disabled = true;
          try {
            if (mode === "live") {
              if (state?.turn?.status === "claimed") {
                posted.add(state.turn.turnId);
                polls = 0;
                await sendPrompt(state.turn.prompt);
                $("retry").hidden = true;
                busy = false;
                schedule(liveLoop, 1000);
              }
            } else if (state?.pending) await sendDemoPrompt();
          } catch (error) {
            show(error.message);
          } finally {
            busy = false;
            $("retry").disabled = false;
          }
        };
        $("resume").onclick = () => {
          $("resume").hidden = true;
          waits = 0;
          schedule(liveLoop, 0);
        };
        for (const type of ["focus", "visibilitychange"])
          window.addEventListener(type, () => {
            if (mode === "live" && ready && !busy && !document.hidden) {
              waits = 0;
              $("resume").hidden = true;
              schedule(liveLoop, 0);
            }
          });
        $("answer").onkeydown = (event) => {
          if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            $("form").requestSubmit();
          }
        };
        (async () => {
          if (parent === window) {
            show(
              "Open this terminal as an MCP App inside regular ChatGPT. An ordinary browser tab has no ChatGPT message bridge.",
            );
            return;
          }
          try {
            await rpc("ui/initialize", {
              appInfo: { name: "zombie-study-terminal", version: "0.2.0" },
              appCapabilities: {},
              protocolVersion: "2026-01-26",
            });
            notify("ui/notifications/initialized", {});
            ready = true;
            if (state) {
              render({ ...state, revision: state.revision });
              if (mode === "live") schedule(liveLoop, 0);
            } else
              show(
                "Host bridge connected. Waiting for the terminal tool result.",
              );
          } catch (error) {
            show(
              error.message +
                " · This host has not passed the regular-Chat UI test.",
            );
          }
        })();
      })();
    </script>
  </body>
</html>
