name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:curriculum
      - run: npm run typecheck
      - run: npm run build

  core:
    name: Core tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:curriculum
      # The sorted file list covers the entire existing root suite, including
      # every deterministic GameTest fixture. Two processes keep physics stable.
      - run: node scripts/ci-tests.mjs ${{ matrix.shard }}/4

  browser:
    name: Isolated offline Chromium gameplay smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:curriculum
      - run: npx playwright install --with-deps chromium
      - name: Run selected synthetic browser regressions
        run: npx playwright test --config=playwright.ci.config.ts
      - name: Retain synthetic browser failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [build, core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if not results or failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
