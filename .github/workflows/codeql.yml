name: CodeQL
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Identify the local CodeQL analysis
        if: ${{ env.ACT }}
        # SARIF post-processing needs this even when uploads are disabled.
        # A local act run has no GitHub workflow-run metadata to query.
        run: printf '%s\n' 'CODEQL_ACTION_ANALYSIS_KEY=.github/workflows/codeql.yml:analyze' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          # act has no GitHub workflow run to attach an upload to. Keep the
          # analysis and required gate, and upload normally on GitHub.
          upload: ${{ env.ACT == 'true' && 'never' || 'always' }}

  security-required:
    name: Security required
    if: ${{ always() }}
    needs: ["analyze"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
