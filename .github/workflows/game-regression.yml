name: Daily deterministic physics regression
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-physics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:curriculum
      - run: npm run test:agents
      - name: Keep synthetic scenario replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deterministic-game-replays
          path: .artifacts/game-tests/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
